# Release packaging for the weavemanifest signing tool. Pure Go, no
# dependencies beyond stdlib; every target cross-compiles from one runner.
version: 2

project_name: weavemanifest

before:
  hooks:
    - go mod download

builds:
  - id: weavemanifest
    main: ./cmd/weavemanifest
    binary: weavemanifest
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: weavemanifest
    ids: [weavemanifest]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

# Sign the checksum file; verifying it verifies every archive. Keyless —
# the signature names this workflow. (The tool's own output — channel
# manifests — is signed by the Ed25519 chain it manages, not by this.)
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  # release-please owns the changelog and release notes.
  disable: true

release:
  mode: append
  footer: |
    ---

    Verify a download against the signed checksum file:

    ```console
    cosign verify-blob \
      --bundle weavemanifest_{{ .Version }}_checksums.txt.sigstore.json \
      --certificate-identity-regexp 'https://github.com/deploymenttheory/weaveplatform-manifest/.*' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      weavemanifest_{{ .Version }}_checksums.txt

    shasum -a 256 -c weavemanifest_{{ .Version }}_checksums.txt --ignore-missing
    ```
